spring:
  application:
    name: apt-board-api

  data:
    web:
      pageable:
        one-indexed-parameters: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE


server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info